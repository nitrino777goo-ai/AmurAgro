<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AgroEvents</title>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f5f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      padding-top: calc(20px + env(safe-area-inset-top, 0px));
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 16px;
      color: #1a1a1a;
      text-align: center;
    }
    .screen { display: none; }
    .screen.active { display: block; }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 420px;
      margin: 0 auto;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      background: #2b6bf0;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    button:active { opacity: 0.75; transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: default; }
    button.warning { background: #e0433c; }
    button.success { background: #2fa84f; }
    button.back {
      background: transparent;
      color: #2b6bf0;
      padding: 10px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    input[type="datetime-local"] {
      appearance: none;
      border: 1px solid #d0d3d9;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      background: #fff;
      color: #1a1a1a;
      width: 100%;
    }

    textarea#comment-input {
      appearance: none;
      border: 1px solid #d0d3d9;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-family: inherit;
      background: #fff;
      color: #1a1a1a;
      width: 100%;
      min-height: 140px;
      resize: vertical;
    }
    #comment-counter {
      text-align: right;
      font-size: 12px;
      color: #888;
      margin-top: -4px;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #666;
      min-height: 20px;
    }
    #status.error { color: #e0433c; }
    #status.ok { color: #2fa84f; }
  </style>
</head>
<body>

  <!-- Шаг 1: выбор участка -->
  <div id="screen-uchastok" class="screen active">
    <h1>Выберите участок</h1>
    <div class="buttons" id="uchastok-buttons"></div>
  </div>

  <!-- Шаг 2: выбор типа события -->
  <div id="screen-event" class="screen">
    <button class="back" id="back-btn">&larr; Назад к участкам</button>
    <h1 id="event-title">Событие</h1>
    <div class="buttons">
      <button class="success" data-type="Начало уборки">
        Начало уборки
      </button>
      <button class="warning" data-type="Конец уборки">
        Окончание уборки
      </button>
    </div>
  </div>

  <!-- Шаг 3: дата/время и отправка -->
  <div id="screen-datetime" class="screen">
    <button class="back" id="back-btn-2">&larr; Назад к событию</button>
    <h1 id="datetime-title">Дата и время</h1>
    <div class="buttons">
      <input type="datetime-local" id="datetime-input" step="60">
      <button class="success" id="submit-btn">Отправить</button>
    </div>
  </div>

  <!-- Комментарий к завершённому простою (открывается кнопкой в сообщении) -->
  <div id="screen-comment" class="screen">
    <h1>Комментарий</h1>
    <div class="buttons">
      <textarea id="comment-input" maxlength="1000" placeholder="Введите комментарий"></textarea>
      <div id="comment-counter">0 / 1000</div>
      <button class="success" id="comment-submit-btn">Отправить</button>
    </div>
  </div>

  <div id="status"></div>

  <script>
    // Замените на адрес вашего сервера с эндпоинтом /api/events
    const API_URL = 'https://halves-imminent-goldfish.ngrok-free.dev/api/events';

    // Эндпоинт для комментариев (тот же сервер)
    const COMMENT_API_URL = API_URL.replace('/api/events', '/api/comment');

    const UCHASTKI = [
      'Анновский', 'Архаринский', 'Белогорский', 'Бурейский',
      'Верхнеполтавский', 'Димский', 'Константиновский',
      'Сергеевский', 'Тамбовский'
    ];

    const statusEl = document.getElementById('status');
    const webAppUser = window.WebApp?.initDataUnsafe?.user ?? null;
    const userId = webAppUser?.id ?? null;
    const userName =
      webAppUser?.name ||
      [webAppUser?.first_name, webAppUser?.last_name].filter(Boolean).join(' ') ||
      null;
    let selectedUchastok = null;
    let selectedType = null;

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || '';
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      setStatus('', '');
    }

    // Форматирование текущей даты/времени для input[type=datetime-local]
    // (локальное время пользователя, без сдвига в UTC)
    function nowForInput() {
      const d = new Date();
      d.setSeconds(0, 0);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 16);
    }

    // Отрисовка кнопок участков
    const uchastokContainer = document.getElementById('uchastok-buttons');
    UCHASTKI.forEach(name => {
      const btn = document.createElement('button');
      btn.textContent = name;
      btn.addEventListener('click', () => {
        selectedUchastok = name;
        document.getElementById('event-title').textContent = 'Участок: ' + name;
        showScreen('screen-event');
      });
      uchastokContainer.appendChild(btn);
    });

    document.getElementById('back-btn').addEventListener('click', () => {
      selectedUchastok = null;
      showScreen('screen-uchastok');
    });

    // Шаг 2 → Шаг 3: переход к дате/времени
    document.querySelectorAll('#screen-event button[data-type]').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedType = btn.dataset.type;
        document.getElementById('datetime-title').textContent = selectedType;
        document.getElementById('datetime-input').value = nowForInput();
        showScreen('screen-datetime');
      });
    });

    document.getElementById('back-btn-2').addEventListener('click', () => {
      selectedType = null;
      showScreen('screen-event');
    });

    // Шаг 3: отправка итоговых данных
    document.getElementById('submit-btn').addEventListener('click', async () => {
      if (!selectedUchastok || !selectedType) return;

      const dtValue = document.getElementById('datetime-input').value;
      if (!dtValue) {
        setStatus('Укажите дату и время', 'error');
        return;
      }

      document.getElementById('submit-btn').disabled = true;
      setStatus('Отправка...', '');

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true'
          },
          body: JSON.stringify({
            uchastok: selectedUchastok,
            typeEv: selectedType,
            eventDateTime: dtValue, // локальное время в формате YYYY-MM-DDTHH:mm
            userId: userId,
            userName: userName
          })
        });

        if (!res.ok) {
          throw new Error('Сервер вернул ошибку ' + res.status);
        }

        setStatus('Записано ✅', 'ok');

        // Небольшая пауза, чтобы пользователь успел увидеть галочку,
        // затем закрываем мини-приложение
        setTimeout(() => {
          window.WebApp?.close();
        }, 2000);
      } catch (err) {
        setStatus('Ошибка: ' + err.message, 'error');
      } finally {
        document.getElementById('submit-btn').disabled = false;
      }
    });

    // ============================================================
    // РЕЖИМ «КОММЕНТАРИЙ» (запуск кнопкой из сообщения бота)
    // ============================================================

    // payload кнопки open_app приходит в initData мини-приложения
    function getStartParam() {
      const wa = window.WebApp;

      const fromUnsafe = wa?.initDataUnsafe?.start_param;
      if (fromUnsafe) return String(fromUnsafe);

      try {
        const raw = wa?.initData;
        if (raw) {
          const v = new URLSearchParams(raw).get('start_param');
          if (v) return v;
        }
      } catch (e) {}

      try {
        const q = new URLSearchParams(window.location.search);
        const h = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const v = q.get('WebAppStartParam') || h.get('WebAppStartParam') ||
                  q.get('start_param') || h.get('start_param');
        if (v) return v;
      } catch (e) {}

      return null;
    }

    const startParam = getStartParam();

    if (startParam && startParam.startsWith('comment_')) {
      const commentInput = document.getElementById('comment-input');
      const commentCounter = document.getElementById('comment-counter');
      const commentBtn = document.getElementById('comment-submit-btn');

      showScreen('screen-comment');

      commentInput.addEventListener('input', () => {
        commentCounter.textContent = commentInput.value.length + ' / 1000';
      });

      commentBtn.addEventListener('click', async () => {
        const text = commentInput.value.trim();

        if (!text) {
          setStatus('Введите комментарий', 'error');
          return;
        }

        commentBtn.disabled = true;
        setStatus('Отправка...', '');

        try {
          const res = await fetch(COMMENT_API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'ngrok-skip-browser-warning': 'true'
            },
            body: JSON.stringify({
              comment: text,
              ref: startParam,
              userId: userId,
              userName: userName
            })
          });

          if (!res.ok) {
            let msg = 'Сервер вернул ошибку ' + res.status;
            try {
              const data = await res.json();
              if (data?.message) msg = data.message;
            } catch (e) {}
            throw new Error(msg);
          }

          setStatus('Комментарий добавлен ✅', 'ok');

          setTimeout(() => {
            window.WebApp?.close();
          }, 2000);
        } catch (err) {
          setStatus('Ошибка: ' + err.message, 'error');
          commentBtn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
